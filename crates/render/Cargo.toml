[package]
name = "pi_bevy_render_plugin"
version = "0.3.5"
authors = ["moyy <myy412001799@gmail.com>"]
edition = "2021"
description = "Renderer for PI Engine"
repository = "https://github.com/GaiaWorld/pi_bevy"
license = "MIT OR Apache-2.0"
keywords = ["pi", "bevy", "plugin"]

[dependencies]
# bevy_app = "0.9"
# bevy_ecs = "0.9"
# bevy_derive = "0.9"
# bevy_window = "0.9"
pi_null = "0.1"
pi_map = "0.2"
pi_time = "0.5"
# bevy_ecs = "0.11"
# bevy_app = {version = "0.11", default-features = false}
pi_world = "0.2"
pi_world_macros     = "0.1"
# bevy_window = "0.11"
bevy_window = {path = "../window", version = "0.3", registry = "yn", package = "pi_bevy_window" }
raw-window-handle = "0.6"
derive_deref = "1.1"

log = "0.4"
thiserror = "1.0"
wgpu = {version = "0.3", registry = "yn", package="pi_wgpu"}
wgpu1 = {version = "25.0.*", package = "wgpu"}
crossbeam = "0.8"
futures = "0.3"
smallvec            = "*"
bitflags = "1.2"

half = "*"
pi_hash = "0.1"
pi_hal = {version = "0.3", registry = "yn"}
pi_futures = "0.1"
pi-async-rt = "0.2"
pi_share = "0.5"
pi_render = { version = "0.3", registry = "yn" }
render_derive = { version = "0.2", registry = "yn" }
pi_bevy_asset = { path = "../asset", version = "0.3", registry = "yn" }
pi_assets = "0.15"
tracing = { version = "0.1", default-features = false, features = ["std"] }

postcard = {version = "1.0", features = ["use-std"]}
serde_derive    = "1.0"
serde           = { version = "1.0", features = ["derive"] }

js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
wasm-bindgen-futures = { version = "0.4" }
lazy_static = "1.4"
pi_key_alloter = {version = "0.6", features = ["serde"]}
crossbeam-channel = "0.5"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# FOR Spector
serde_json = "1.0"
json = { version = "0.12" }
pi_async_httpc = { version="0.6" }
pi_ws = { version="0.6" }
pi_tcp = { version="0.5" }
float-ord = "0.3"
async-trait = "0.1"
spin_sleep = "1.1"
num_cpus = "1.13"
html5ever = "0.27"
markup5ever_rcdom = "0.3"
ahash = "0.8"

[features]
trace = []
webgl = ["pi_render/webgl"]
single_thread = [] # 本地平台，设置该feature有效，运行时为单线程运行时

[dev-dependencies]
# bevy_ecs = { version = "0.11", default-features = false}
winit = { registry = "yn", version = "0.28"}
pi_bevy_winit_window = { path = "../winit_window", version = "0.3", registry = "yn" }
lazy_static = '1.4'
# bevy_log = "0.11"
# bevy_a11y = "0.11"
# bevy_input = "0.11"

[target.'cfg(target_os = "android")'.dev-dependencies]
ndk-glue = "0.7"

[[example]]
crate-type = ["cdylib"]
name = "app_android"